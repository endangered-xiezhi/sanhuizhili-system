<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1A1A24" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  
  <!-- Background Image -->
  <image href="../images/cover_bg.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />
  
  <!-- Overlay Gradient for Text Legibility -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#heroGradient)" />
  
  <!-- Content Container -->
  <g transform="translate(60, 200)">
    <!-- Title -->
    <text x="0" y="100" font-family="'Times New Roman', KaiTi, serif" font-size="72" font-weight="bold" fill="#F8F9FA">三会智理</text>
    
    <!-- Subtitle -->
    <rect x="0" y="140" width="60" height="6" fill="#1565C0" />
    <text x="0" y="190" font-family="'Times New Roman', KaiTi, serif" font-size="36" font-weight="bold" fill="#B0B0C0">将繁琐留给系统，将合规交予规则</text>
    
    <!-- Date / Info -->
    <text x="0" y="400" font-family="'Times New Roman', KaiTi, serif" font-size="18" fill="#808090">2026年7月</text>
  </g>
</svg>
