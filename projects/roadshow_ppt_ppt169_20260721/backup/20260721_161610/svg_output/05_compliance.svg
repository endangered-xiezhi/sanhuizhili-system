<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#1A1A24" />
  
  <g transform="translate(60, 50)">
    <use data-icon="tabler-outline/shield-check" x="0" y="0" width="48" height="48" fill="#C41E3A" stroke-width="2"/>
    <text x="60" y="36" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="48" font-weight="bold" fill="#F8F9FA">核心壁垒: 透明可追溯的合规双通道审查</text>
    <line x1="0" y1="60" x2="1160" y2="60" stroke="#3A3A4A" stroke-width="2" />
  </g>

  <!-- Flowchart Diagram -->
  <g transform="translate(60, 150)">
    <!-- LLM Channel -->
    <rect x="0" y="0" width="540" height="250" rx="16" fill="#1E3A5F" />
    <use data-icon="tabler-outline/box-model" x="240" y="20" width="60" height="60" fill="#D4AF37" stroke-width="2"/>
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="bold" fill="#F8F9FA" text-anchor="middle" x="270" y="120">通道一: 大模型辅助</text>
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#B0B0C0" text-anchor="middle" x="270" y="170">进行自由文本分析，生成综合报告</text>
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#B0B0C0" text-anchor="middle" x="270" y="210">处理模糊语义意图，快速了解整体情况</text>

    <!-- Rule Engine Channel -->
    <rect x="620" y="0" width="540" height="250" rx="16" fill="#1E3A5F" />
    <use data-icon="tabler-outline/engine" x="860" y="20" width="60" height="60" fill="#00796B" stroke-width="2"/>
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="bold" fill="#F8F9FA" text-anchor="middle" x="890" y="120">通道二: 规则引擎 (最核心)</text>
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#B0B0C0" text-anchor="middle" x="890" y="170">拒绝黑箱：不依赖大模型，避免幻觉</text>
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#B0B0C0" text-anchor="middle" x="890" y="210">正则提取客观事实，精准匹配法规生成风险项</text>

    <!-- Convergence Arrows -->
    <use data-icon="tabler-outline/arrow-down" x="550" y="270" width="60" height="60" fill="#808090" stroke-width="2"/>

    <!-- Bottom Result -->
    <rect x="0" y="350" width="1160" height="150" rx="16" fill="#2A2A38" stroke="#1565C0" stroke-width="4"/>
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" font-weight="bold" fill="#F8F9FA" text-anchor="middle" x="580" y="410">透明可回溯的 0-100 合规审查打分体系</text>
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" fill="#B0B0C0" text-anchor="middle" x="580" y="460">推理链条完全透明：要素提取 -> 法规匹配 -> 交叉核验 -> 风险评级</text>
  </g>

  <text x="60" y="690" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#808090">三会智理 | 路演汇报</text>
  <text x="1220" y="690" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#808090" text-anchor="end">05</text>
</svg>
