<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#1A1A24" />
  
  <g transform="translate(60, 50)">
    <use data-icon="tabler-outline/file-text" x="0" y="0" width="48" height="48" fill="#1565C0" stroke-width="2"/>
    <text x="60" y="36" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="48" font-weight="bold" fill="#F8F9FA">文书中心与与会人员管理</text>
    <line x1="0" y1="60" x2="1160" y2="60" stroke="#3A3A4A" stroke-width="2" />
  </g>

  <g transform="translate(60, 150)">
    <!-- Docs Center -->
    <rect x="0" y="0" width="540" height="350" rx="16" fill="#2A2A38" stroke="#1565C0" stroke-width="3" />
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" font-weight="bold" fill="#F8F9FA" text-anchor="middle" x="270" y="60">文书中心 (一键打包成卷)</text>
    <line x1="50" y1="90" x2="490" y2="90" stroke="#3A3A4A" stroke-width="2" />
    
    <use data-icon="tabler-outline/check" x="40" y="120" width="36" height="36" fill="#00796B" stroke-width="2"/>
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#F8F9FA" x="90" y="145">涵盖会议通知、议程、签到表等</text>
    
    <use data-icon="tabler-outline/check" x="40" y="180" width="36" height="36" fill="#00796B" stroke-width="2"/>
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#F8F9FA" x="90" y="205">支持在线编辑与实时预览导出</text>

    <use data-icon="tabler-outline/check" x="40" y="240" width="36" height="36" fill="#00796B" stroke-width="2"/>
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#F8F9FA" x="90" y="265">匹配法定数量：股东会9份，董监会6份</text>

    <!-- Personnel Matrix -->
    <rect x="620" y="0" width="540" height="350" rx="16" fill="#2A2A38" stroke="#00796B" stroke-width="3" />
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" font-weight="bold" fill="#F8F9FA" text-anchor="middle" x="890" y="60">与会人员矩阵</text>
    <line x1="670" y1="90" x2="1110" y2="90" stroke="#3A3A4A" stroke-width="2" />
    
    <use data-icon="tabler-outline/shield-check" x="660" y="120" width="36" height="36" fill="#1565C0" stroke-width="2"/>
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#F8F9FA" x="710" y="145">全景化董监高及股东持股任职信息</text>

    <use data-icon="tabler-outline/shield-check" x="660" y="180" width="36" height="36" fill="#1565C0" stroke-width="2"/>
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#F8F9FA" x="710" y="205">自动化底线合规：独董占比 33% 校验</text>

    <use data-icon="tabler-outline/shield-check" x="660" y="240" width="36" height="36" fill="#1565C0" stroke-width="2"/>
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#F8F9FA" x="710" y="265">任期兼职互斥自动拦截与到期预警</text>
  </g>

  <text x="60" y="690" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#808090">三会智理 | 路演汇报</text>
  <text x="1220" y="690" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#808090" text-anchor="end">04</text>
</svg>
