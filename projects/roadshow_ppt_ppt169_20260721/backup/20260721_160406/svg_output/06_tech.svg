<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#1A1A24" />
  
  <g transform="translate(60, 50)">
    <use data-icon="tabler-outline/engine" x="0" y="0" width="48" height="48" fill="#D4AF37" stroke-width="2"/>
    <text x="60" y="36" font-family="'Times New Roman', KaiTi, serif" font-size="48" font-weight="bold" fill="#F8F9FA">技术实现架构与外部生态集成</text>
    <line x1="0" y1="60" x2="1160" y2="60" stroke="#3A3A4A" stroke-width="2" />
  </g>

  <!-- Architecture Flowchart Diagram -->
  <g transform="translate(60, 150)">
    <!-- Frontend -->
    <rect x="0" y="0" width="540" height="260" rx="16" fill="#1E3A5F" />
    <text font-family="'Times New Roman', KaiTi, serif" font-size="32" font-weight="bold" fill="#F8F9FA" text-anchor="middle" x="270" y="50">前端能力 (React/Vite)</text>
    <line x1="20" y1="70" x2="520" y2="70" stroke="#3A3A4A" stroke-width="2" />
    <use data-icon="tabler-outline/check" x="40" y="100" width="36" height="36" fill="#00796B" stroke-width="2"/>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#F8F9FA" x="90" y="125">SPA 单页应用架构</text>
    <use data-icon="tabler-outline/check" x="40" y="160" width="36" height="36" fill="#00796B" stroke-width="2"/>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#F8F9FA" x="90" y="185">docx.js 浏览器端直接生成 Word 文档</text>
    <use data-icon="tabler-outline/check" x="40" y="220" width="36" height="36" fill="#00796B" stroke-width="2"/>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#F8F9FA" x="90" y="245">localStorage 本地缓存与日程提醒计算</text>

    <!-- Arrow -->
    <use data-icon="tabler-outline/arrow-right" x="550" y="100" width="60" height="60" fill="#808090" stroke-width="2"/>

    <!-- Backend -->
    <rect x="620" y="0" width="540" height="260" rx="16" fill="#2A2A38" stroke="#1565C0" stroke-width="3" />
    <text font-family="'Times New Roman', KaiTi, serif" font-size="32" font-weight="bold" fill="#F8F9FA" text-anchor="middle" x="890" y="50">后端服务 (Express)</text>
    <line x1="640" y1="70" x2="1140" y2="70" stroke="#3A3A4A" stroke-width="2" />
    <use data-icon="tabler-outline/check" x="660" y="90" width="36" height="36" fill="#1565C0" stroke-width="2"/>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#F8F9FA" x="710" y="115">同一进程内外双角色兼顾</text>
    <use data-icon="tabler-outline/check" x="660" y="140" width="36" height="36" fill="#1565C0" stroke-width="2"/>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#F8F9FA" x="710" y="165">HMAC-SHA256 安全签名认证机制</text>
    <use data-icon="tabler-outline/check" x="660" y="190" width="36" height="36" fill="#1565C0" stroke-width="2"/>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#F8F9FA" x="710" y="215">服务端 JSZip 读取母板批量渲染文书</text>
    <use data-icon="tabler-outline/check" x="660" y="240" width="36" height="36" fill="#1565C0" stroke-width="2"/>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#F8F9FA" x="710" y="265">轻量级大模型接口封装与失败降级策略</text>

    <!-- Ecosystem Box -->
    <rect x="0" y="320" width="1160" height="180" rx="16" fill="#1E3A5F" />
    <text font-family="'Times New Roman', KaiTi, serif" font-size="32" font-weight="bold" fill="#F8F9FA" text-anchor="middle" x="580" y="60">外部生态接入与数据源</text>
    <line x1="20" y1="80" x2="1140" y2="80" stroke="#3A3A4A" stroke-width="2" />
    
    <use data-icon="tabler-outline/database" x="60" y="110" width="48" height="48" fill="#D4AF37" stroke-width="2"/>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="28" font-weight="bold" fill="#D4AF37" x="120" y="140">飞书多维表格: 作为核心业务主数据源，支持按表名自动匹配或环境变量兜底</text>

    <use data-icon="tabler-outline/microphone" x="60" y="180" width="48" height="48" fill="#D4AF37" stroke-width="2"/>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="28" font-weight="bold" fill="#D4AF37" x="120" y="210">飞书妙记及自动化回调: 提供高精度 ASR 录音识别与事件回调写回支持</text>
  </g>

  <text x="60" y="690" font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#808090">三会智理 | 路演汇报</text>
  <text x="1220" y="690" font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#808090" text-anchor="end">06</text>
</svg>
