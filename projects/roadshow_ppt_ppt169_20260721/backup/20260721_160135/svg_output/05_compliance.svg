<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#1A1A24" />
  
  <g transform="translate(60, 50)">
    <use data-icon="tabler-outline/shield-check" x="0" y="0" width="48" height="48" fill="#C41E3A" stroke-width="2"/>
    <text x="60" y="36" font-family="'Times New Roman', KaiTi, serif" font-size="48" font-weight="bold" fill="#F8F9FA">核心壁垒: 透明可追溯的合规双通道审查</text>
    <line x1="0" y1="60" x2="1160" y2="60" stroke="#3A3A4A" stroke-width="2" />
  </g>

  <!-- Flowchart Diagram -->
  <g transform="translate(60, 150)">
    <!-- LLM Channel -->
    <rect x="0" y="0" width="460" height="220" rx="16" fill="#1E3A5F" />
    <use data-icon="tabler-outline/box-model" x="200" y="20" width="60" height="60" fill="#D4AF37" stroke-width="2"/>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="32" font-weight="bold" fill="#F8F9FA" text-anchor="middle" x="230" y="120">通道一: 大模型辅助</text>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#B0B0C0" text-anchor="middle" x="230" y="160">自由文本分析，生成可读性强的综合报告</text>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#B0B0C0" text-anchor="middle" x="230" y="195">处理语义意图，快速了解整体情况</text>

    <!-- Rule Engine Channel -->
    <rect x="640" y="0" width="460" height="220" rx="16" fill="#1E3A5F" />
    <use data-icon="tabler-outline/engine" x="840" y="20" width="60" height="60" fill="#00796B" stroke-width="2"/>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="32" font-weight="bold" fill="#F8F9FA" text-anchor="middle" x="870" y="120">通道二: 规则引擎 (最核心)</text>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#B0B0C0" text-anchor="middle" x="870" y="160">非黑箱：不依赖大模型，避免幻觉</text>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#B0B0C0" text-anchor="middle" x="870" y="195">基于正则和关键词提取客观事实并匹配法条</text>

    <!-- Convergence Arrows -->
    <use data-icon="tabler-outline/arrow-down" x="520" y="240" width="60" height="60" fill="#808090" stroke-width="2"/>

    <!-- Bottom Result -->
    <rect x="150" y="320" width="800" height="150" rx="16" fill="#2A2A38" stroke="#1565C0" stroke-width="4"/>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="36" font-weight="bold" fill="#F8F9FA" text-anchor="middle" x="550" y="380">透明可回溯的 0-100 合规审查指数</text>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="28" fill="#B0B0C0" text-anchor="middle" x="550" y="430">推理链条完全透明：要素提取 -> 法规匹配 -> 交叉核验 -> 风险评级卡片</text>
  </g>

  <text x="60" y="690" font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#808090">三会智理 | 路演汇报</text>
  <text x="1220" y="690" font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#808090" text-anchor="end">05</text>
</svg>
