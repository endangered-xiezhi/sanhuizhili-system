<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#0A0A0A" />
  
  <circle cx="1280" cy="720" r="600" fill="#2E5A8C" opacity="0.05" filter="blur(100px)"/>

  <g transform="translate(72, 56)">
    <use data-icon="tabler-outline/microphone" x="0" y="0" width="48" height="48" fill="#F2F2F2" stroke-width="1.5"/>
    <text x="64" y="36" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="44" font-weight="bold" fill="#F2F2F2">核心功能: 会议管理与录音工作台</text>
  </g>

  <g transform="translate(72, 160)">
    <!-- Meeting Management -->
    <rect x="0" y="0" width="520" height="360" rx="6" fill="#111111" stroke="#333333" stroke-width="1" />
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold" fill="#F2F2F2" text-anchor="middle" x="260" y="60">会议管理模块</text>
    <line x1="40" y1="90" x2="480" y2="90" stroke="#333333" stroke-width="1" />
    
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#B3B3B3" x="80" y="145">自动提示法定门槛 (如 <tspan fill="#4A90D9" font-weight="bold" font-size="28">10%</tspan> 提议权)</text>
    
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#B3B3B3" x="80" y="215">与会人员智能排序与标记</text>

    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#B3B3B3" x="80" y="285">数据容错存盘，防缺失与丢失</text>

    <!-- Arrow Right -->
    <use data-icon="tabler-outline/arrow-right" x="546" y="150" width="60" height="60" fill="#666666" stroke-width="1.5"/>

    <!-- Recording Workspace -->
    <rect x="632" y="0" width="520" height="360" rx="6" fill="#111111" stroke="#333333" stroke-width="1" />
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold" fill="#F2F2F2" text-anchor="middle" x="892" y="60">录音工作台</text>
    <line x1="672" y1="90" x2="1112" y2="90" stroke="#333333" stroke-width="1" />
    
    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#B3B3B3" x="712" y="145">集成飞书妙记 ASR 语音转写</text>

    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#B3B3B3" x="712" y="215">识别文本与议案自动关联对齐</text>

    <text font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#B3B3B3" x="712" y="285">在线预览排版，一键导出国标 Word</text>
  </g>

  <text x="72" y="690" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#666666">三会智理 | 路演汇报</text>
  <text x="1208" y="690" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#666666" text-anchor="end">03</text>
</svg>
