<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#1A1A24" />
  
  <g transform="translate(60, 50)">
    <use data-icon="tabler-outline/box-model" x="0" y="0" width="48" height="48" fill="#1565C0" stroke-width="2"/>
    <text x="60" y="36" font-family="'Times New Roman', KaiTi, serif" font-size="48" font-weight="bold" fill="#F8F9FA">产品概述: 全栈驱动与飞书数据中台</text>
    <line x1="0" y1="60" x2="1160" y2="60" stroke="#3A3A4A" stroke-width="2" />
  </g>

  <!-- Flowchart: Architecture -->
  <g transform="translate(60, 150)">
    <!-- Frontend -->
    <rect x="0" y="0" width="300" height="200" rx="16" fill="#2A2A38" stroke="#1E3A5F" stroke-width="3" />
    <use data-icon="tabler-outline/server" x="120" y="30" width="60" height="60" fill="#1565C0" stroke-width="2"/>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="32" font-weight="bold" fill="#F8F9FA" text-anchor="middle" x="150" y="130">全栈 Web 应用</text>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#B0B0C0" text-anchor="middle" x="150" y="170">React + Express</text>

    <!-- Arrow -->
    <use data-icon="tabler-outline/arrow-right" x="320" y="70" width="60" height="60" fill="#808090" stroke-width="2"/>

    <!-- Dashboard -->
    <rect x="400" y="0" width="360" height="200" rx="16" fill="#1E3A5F" />
    <text font-family="'Times New Roman', KaiTi, serif" font-size="32" font-weight="bold" fill="#F8F9FA" text-anchor="middle" x="580" y="70">全局控制台 Dashboard</text>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#F8F9FA" text-anchor="middle" x="580" y="120">核心指标监控 + 日历视图</text>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#B0B0C0" text-anchor="middle" x="580" y="160">临期预警与合规指数</text>

    <!-- Arrow -->
    <use data-icon="tabler-outline/arrow-right" x="780" y="70" width="60" height="60" fill="#808090" stroke-width="2"/>

    <!-- Backend / Data -->
    <rect x="860" y="0" width="300" height="200" rx="16" fill="#2A2A38" stroke="#00796B" stroke-width="3" />
    <use data-icon="tabler-outline/database" x="980" y="30" width="60" height="60" fill="#00796B" stroke-width="2"/>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="32" font-weight="bold" fill="#F8F9FA" text-anchor="middle" x="1010" y="130">飞书多维表格</text>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#B0B0C0" text-anchor="middle" x="1010" y="170">实时读写的核心数据</text>
  </g>

  <!-- Big Summary Bottom Box -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="1160" height="120" rx="16" fill="#1565C0" fill-opacity="0.1" stroke="#1565C0" stroke-width="2" />
    <use data-icon="tabler-outline/check" x="100" y="30" width="60" height="60" fill="#1565C0" stroke-width="2"/>
    <text font-family="'Times New Roman', KaiTi, serif" font-size="36" font-weight="bold" fill="#1565C0" text-anchor="middle" x="580" y="70">非孤立数据库架构：与企业现有系统和人员无缝协同</text>
  </g>

  <text x="60" y="690" font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#808090">三会智理 | 路演汇报</text>
  <text x="1220" y="690" font-family="'Times New Roman', KaiTi, serif" font-size="24" fill="#808090" text-anchor="end">02</text>
</svg>
