      <stop offset="0%" stop-color="#1A1A24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1A1A24" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  
  <image href="../images/cover_bg.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />
