  <g transform="translate(640, 240)">
    <text x="0" y="0" font-family="'Times New Roman', KaiTi, serif" font-size="96" font-weight="bold" fill="#F8F9FA" text-anchor="middle">谢谢聆听，敬请批评指正</text>
    
    <rect x="-60" y="40" width="120" height="8" fill="#1565C0" />
    
